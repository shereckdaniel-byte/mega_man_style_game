name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Godot ${{ matrix.godot }} headless
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        godot: ["4.7-stable"]

    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/.local/godot
          key: godot-${{ matrix.godot }}-linux

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          V="${{ matrix.godot }}"
          mkdir -p ~/.local/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${V}_linux.x86_64" ~/.local/godot/godot
          chmod +x ~/.local/godot/godot

      - name: Add Godot to PATH
        run: echo "$HOME/.local/godot" >> "$GITHUB_PATH"

      - name: Version
        run: godot --version

      # Must run first: class_name registration lives in .godot/, which is not
      # committed, so a fresh checkout cannot resolve any global class until the
      # import pass has built the cache.
      - name: Import assets
        run: godot --headless --import

      # Boots the main scene for one frame. This is what catches parse errors in
      # the autoloads, since nothing else loads them.
      - name: Boot check
        run: godot --headless --quit

      - name: Tests
        run: godot --headless --script res://tests/run_tests.gd
