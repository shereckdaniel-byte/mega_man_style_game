; Export presets. Four platforms, one shared feature set.
;
; Committed on purpose: the alternative is a build that only exists on whichever
; machine last opened the editor, which is the same argument every generated
; asset in this repository makes.
;
; `tools/export.sh` drives these headlessly. Everything is x86_64 and 64-bit
; only -- the project targets desktops from the last decade and a web browser,
; and shipping 32-bit builds nobody asked for doubles the release for nothing.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="assets/backgrounds/*.md, docs/*, tools/*"
export_path="build/linux/seawall.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false

